<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poskestren Digital</title>
  <link rel="icon" href="https://iili.io/fENwpbp.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
      position: relative;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating button penolong jika iframe diblokir/error */
    .fallback-btn {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 12px;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
      
      /* Animasi memudar */
      opacity: 1;
      visibility: visible;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .fallback-btn:hover {
      background: #0f172a;
    }

    /* Class untuk menyembunyikan tombol secara otomatis */
    .fallback-btn.hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/a/~/macros/s/AKfycbwJV3l4Ot2gx1h33A3DTEKWxMGlR-JDa_0qpJYT3jNSIS-rohCrc1Gbi-MUi-a_fCJWag/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      sandbox="allow-forms allow-modals allow-popups-to-escape-sandbox allow-popups allow-scripts allow-same-origin"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <!-- Bantuan jika terjadi bentrokan multi-akun Google -->
  <a 
    id="fallbackBtn"
    class="fallback-btn" 
    href="https://script.google.com/a/~/macros/s/AKfycbwJV3l4Ot2gx1h33A3DTEKWxMGlR-JDa_0qpJYT3jNSIS-rohCrc1Gbi-MUi-a_fCJWag/exec" 
    target="_blank">
    <span>⚠️ Tampilan Error? Klik untuk Buka Langsung</span>
  </a>

  <script>
    // Sembunyikan tombol otomatis setelah 5 detik
    setTimeout(function() {
      var btn = document.getElementById('fallbackBtn');
      if (btn) {
        btn.classList.add('hidden');
      }
    }, 5000);
  </script>

</body>
</html>
